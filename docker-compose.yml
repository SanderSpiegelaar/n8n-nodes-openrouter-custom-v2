services:
  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      N8N_HOST: "0.0.0.0"
      N8N_PORT: "5678"
      N8N_PROTOCOL: "http"
      # Required for sign-in over plain HTTP in local development
      N8N_SECURE_COOKIE: "false"
      GENERIC_TIMEZONE: "UTC"
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  n8n_data:
